# Publiceert de clubpagina's naar GitHub Pages.
# Vervangt de standaard "pages build and deployment" (Jekyll) die herhaaldelijk
# bleef hangen in "updating_pages". Werkt pas als Settings → Pages → Source = GitHub Actions.
#
# - Geen Jekyll: de site is gewone HTML en wordt ongewijzigd gepubliceerd.
# - Een nieuwere push annuleert een lopende publicatie (nooit meer "in progress deployment").
# - Weigert GitHub omdat een oude publicatie vastzit, dan wordt die geannuleerd.
# - Hangt de publicatie toch, dan geeft de eerste poging na 4 minuten op en
#   volgt na 1 minuut wachten automatisch een tweede poging.
# - Handmatig opnieuw starten kan via Actions → Pages publiceren → Run workflow.

name: Pages publiceren

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publiceren:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.poging2.outputs.page_url || steps.poging1.outputs.page_url }}
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Pages instellen
        uses: actions/configure-pages@v5

      - name: Site inpakken
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publiceren (poging 1)
        id: poging1
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 240000

      # GitHub houdt soms een vastgelopen publicatie als "lopend" vast en weigert dan
      # elke nieuwe ("in progress deployment"). Annuleer oudere publicaties en probeer opnieuw.
      - name: Vastgelopen publicaties annuleren
        if: steps.poging1.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=15" --jq '.[].sha' | sort -u); do
            [ "$sha" = "$GITHUB_SHA" ] && continue
            if gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments/$sha/cancel" >/dev/null 2>&1; then echo "geannuleerd: $sha"; fi
          done

      - name: Even wachten voor poging 2
        if: steps.poging1.outcome == 'failure'
        run: sleep 60

      - name: Publiceren (poging 2)
        id: poging2
        if: steps.poging1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 300000
